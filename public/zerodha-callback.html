<!DOCTYPE html>
<html>
<head>
  <title>Zerodha Callback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
    .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { font-size: 20px; color: #333; }
    .token { font-family: monospace; font-size: 14px; background: #f0f0f0; padding: 12px; border-radius: 6px; word-break: break-all; margin: 15px 0; cursor: pointer; }
    .token:hover { background: #e0e0e0; }
    .copy-btn { background: #059669; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .copy-btn:hover { background: #047857; }
    .error { color: #dc2626; }
    .back-link { color: #2563eb; text-decoration: underline; margin-top: 15px; display: inline-block; }
  </style>
</head>
<body>
  <div class="box">
    <h1 id="title">Zerodha Connection</h1>
    <div id="content"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const requestToken = params.get('request_token');
    const status = params.get('status');
    const content = document.getElementById('content');
    
    if (requestToken) {
      document.getElementById('title').textContent = '✅ Token Received!';
      content.innerHTML = `
        <p>Copy this token and paste it in the dashboard:</p>
        <div class="token" id="token" onclick="copyToken()">${requestToken}</div>
        <button class="copy-btn" onclick="copyToken()">📋 Copy Token</button>
        <br><br>
        <a class="back-link" href="/">← Back to Dashboard</a>
      `;
      
      function copyToken() {
        navigator.clipboard.writeText(requestToken);
        alert('Token copied! Go paste it in the dashboard.');
      }
    } else if (status === 'error') {
      content.innerHTML = `<p class="error">Authorization failed. Please try again.</p>`;
    } else {
      // Maybe the token is in the hash fragment (some redirects use #)
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const hashToken = hashParams.get('request_token');
      if (hashToken) {
        content.innerHTML = `
          <p>Copy this token and paste it in the dashboard:</p>
          <div class="token" onclick="copyToken('${hashToken}')">${hashToken}</div>
          <button class="copy-btn" onclick="copyToken('${hashToken}')">📋 Copy Token</button>
        `;
      } else {
        content.innerHTML = `<p>No token found in URL. Check the address bar for <code>request_token=...</code></p>
        <p>Full URL: <code>${window.location.href}</code></p>`;
      }
    }
  </script>
</body>
</html>
