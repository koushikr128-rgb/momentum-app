# Render.com blueprint — deploys the Python yfinance backend as a web service
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: momentum-python-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT --timeout 120 scripts.render_server:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONUNBUFFERED
        value: "1"
    plan: free
    autoDeploy: true
